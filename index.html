
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentric</title>
    <meta name="description" content="Pentric - Professional Academic Timetable Management System created by PPF Innovations and Technology Group." />
    <meta property="og:title" content="Pentric" />
    <meta property="og:description" content="Pentric - Professional Academic Timetable Management System created by PPF Innovations and Technology Group." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9; /* Slate-100 */
        color: #0f172a; /* Slate-900 */
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: white;
        }
        /* Ensure background colors print */
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact;
      }
      .print-only {
        display: none;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #e2e8f0; 
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8; 
        border-radius: 5px;
        border: 2px solid #e2e8f0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Utilities */
      .writing-mode-vertical {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        transform: rotate(180deg);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
